version: "3.9"

# ══════════════════════════════════════════════════════════════════════
#  PROFILES
#
#  Default (no profile):  starts the app only
#    docker compose up
#
#  dev profile: starts the app + a local MSSQL server for development
#    docker compose --profile dev up
#
#  The "mssql-dev" service is for LOCAL DEVELOPMENT AND TESTING ONLY.
#  Point the app at databases via platform menu → Connectors, or ship
#  deploy/connectors/connectors.json for first-boot seed.
# ══════════════════════════════════════════════════════════════════════

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - MIA_DATA_DIR=/data
      - AGENT_WORKSPACE=/workspace
      - LLM_PROVIDER=${LLM_PROVIDER:-copilot-chat}
      # Optional: pin which named mssql connector the agent uses by default
      - MSSQL_DEFAULT_CONNECTION=${MSSQL_DEFAULT_CONNECTION:-}
    volumes:
      - app-data:/data
      - workspace:/workspace
      # Mount connectors seed (or edit Connectors in the UI after first login)
      - ./deploy/connectors:/app/deploy/connectors:ro
    restart: unless-stopped

  # ── DEV-ONLY: local SQL Server ────────────────────────────────────
  # Started only when you run:  docker compose --profile dev up
  # Do NOT wire this to production workloads.
  # After it is healthy, add a connector in the UI (host: mssql-dev, port 1433)
  # or put the same in deploy/connectors/connectors.json.
  mssql-dev:
    profiles: [dev]
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_DEV_SA_PASSWORD:-Agent001_Dev!P4ss}
    ports:
      - "1433:1433"
    volumes:
      - mssql-dev-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_DEV_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  app-data:
  mssql-dev-data:
  workspace:
